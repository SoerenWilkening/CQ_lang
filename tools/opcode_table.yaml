# tools/opcode_table.yaml — opcode surface (single source of truth).
#
# Drives `tools/gen_templates.py` (+ tools/abi_codegen.py), which emits:
#   - runtime/cq_templates.h           (1732 declarations)
#   - runtime/cq_templates.c           (printf-name stubs)
#
# Policy: backend stays stubbed (memory `feedback-no-backend-until-frontend-done`).
# This file declares SYMBOLS and DISPATCH METADATA only; never template bodies.
#
# ----------------------------------------------------------------------------
# SCHEMA (inline; validated by tools/gen_templates_test.py)
# ----------------------------------------------------------------------------
# Top-level keys:
#   version          : string  — schema version, "1".
#   phase            : string  — owning phase identifier, "phase3".
#   widths           : map     — symbolic width -> {bits, c_type, domain}.
#   predicates       : map     — predicate-family -> ordered LLVM mnemonics.
#   binary_opcodes   : list    — every binary data opcode (18).
#   unary_opcodes    : list    — every unary data opcode (1: fneg).
#   compare_opcodes  : list    — comparator opcodes (2: icmp, fcmp).
#   cast_opcodes     : list    — width / domain casts (9 kinds, 90 pairs).
#
# Required keys per `binary_opcodes` entry:
#   opcode, family, widths, llvm_inst, c_operators, variants
#   (signed_variant: bool optional — present when sign-aware).
# Required keys per `unary_opcodes` entry:
#   opcode, family, widths, llvm_inst, c_operators, variants.
# Required keys per `compare_opcodes` entry:
#   opcode, family, widths, llvm_inst, predicate_set, result_type, variants.
#   (result_type MUST be "flag_handle"; PRD §"Comparison contract".)
# Required keys per `cast_opcodes` entry:
#   opcode, kind, llvm_inst, c_operators, pairs, variants.
#   pairs is list of {from, to}; both names must appear in `widths`.
#
# Naming convention (modifier-then-variant; control axis before direction):
#   forward Q+Q:     cq_template_<op>[_<pred>]_<W>[_<from_to>]
#   forward Q+C(rhs): cq_template_<op>[_<pred>]_<W>[_<from_to>]_hl
#   forward C+Q(lhs): cq_template_<op>[_<pred>]_<W>[_<from_to>]_lh
#   inverse Q+Q:     cq_template_<op>[_<pred>]_<W>[_<from_to>]_inv
#   inverse Q+C(rhs): cq_template_<op>[_<pred>]_<W>[_<from_to>]_hl_inv
#   inverse C+Q(lhs): cq_template_<op>[_<pred>]_<W>[_<from_to>]_lh_inv
# Controlled forms (Phase 4, §2.8): `_controlled` follows the shape suffix,
# `_inv` stays last; the control flag is always argument 0:
#   cq_template_<op>[_<pred>]_<W>[_<from_to>][_hl|_lh]_controlled[_inv]
# Controlled axis is BINARY-ops-only — compares get no controlled grid
# (nesting combines flags via cqrt_toffoli, PRD §2.7).
# Uncompute forms (Phase 5, §2.3/DD-3): the VOID in-place `_unc` family. Only
# the `_hl`/`_lh` shape tokens are spelled, then `_unc` last; QQ is the BARE
# base symbol + `_unc` (exactly as the forward/inv/controlled QQ forms are bare —
# the forward QQ template is `cq_template_<op>_<W>`, NOT `..._qq`, so the
# uncompute twin must match it to link against the emitter's bare-QQ name). `out`
# is prepended as argument 0 and the return is void:
#   cq_template_<op>[_<pred>]_<W>[_<from_to>][_hl|_lh]_unc(out, src…)      (binary)
#   cq_template_<op>_<from_to>_unc(out, src)                              (cast)
#   cq_template_fneg_<W>_unc(out, src)                                    (unary)
# Uncompute axis (WI-0, §6.0): binary + unary + cast + COMPARES. Compares carry
# only unc_qq/unc_hl — a lhs-literal compare canonicalizes by predicate flip
# (`5<x` ⇒ `x>5`, CompareLowering.cpp / TemplateName.cpp), so compares have NO
# `_lh` on ANY axis, exactly like the commutative binary ops (add/mul/and/or/xor).
#
# Acceptance count check (total == 1732). Phase 7.1 Increment D added the f16
# (IEEE half) fp width to every fp row + the f16 cast pairs (+170 vs the 1562
# baseline); the sibling i128 int width is DEFERRED (its C ABI shreds __int128
# to {i64,i64}; tracked as a pre-freeze follow-up), so the INT rows keep 5
# widths {i1,i8,i16,i32,i64} and the fp rows now carry 3 {f16,f32,f64}:
#   binary_opcodes  == 18 (7 int_arith + 6 int_bitwise + 5 fp_arith). int rows
#                          5 widths, fp rows 3 widths (f16 added). controlled axis
#                          mirrors fwd/inv across qq/hl/lh; uncompute axis adds one
#                          void `_unc` per forward shape -> 1045 (was 980, +65 fp).
#   unary_opcodes   == 1  (fneg; 3 fp widths; fwd/inv/unc -> 9)
#   compare_opcodes == 2  (icmp x 10 preds x 5 widths; fcmp x 6 preds x 3 widths;
#                          NO controlled axis; uncompute axis (WI-0) adds unc_qq +
#                          unc_hl only — no _lh, compares canonicalize lhs-literals
#                          by predicate flip — so 6 variants total -> 408)
#   cast_opcodes    == 9  (sext, zext, trunc, fpext, fptrunc, sitofp, uitofp,
#                          fptosi, fptoui; 90 cross-pairs (68 + 22 f16);
#                          fwd/inv/unc -> 270)
# ============================================================================

version: "1"
phase: "phase3"

# -- Widths --------------------------------------------------------------------
# Symbolic names map to ABI metadata. Runtime ABI is signedness-agnostic
# (PRD §"Width unification"). 8 widths total (Phase 7.1 Increment D added f16;
# the sibling i128 is deferred — its C ABI shreds __int128 to {i64,i64}).
widths:
  i1:  { bits: 1,  c_type: "bool",    domain: "int" }
  i8:  { bits: 8,  c_type: "int8_t",  domain: "int" }
  i16: { bits: 16, c_type: "int16_t", domain: "int" }
  i32: { bits: 32, c_type: "int32_t", domain: "int" }
  i64: { bits: 64, c_type: "int64_t", domain: "int" }
  f16: { bits: 16, c_type: "_Float16", domain: "fp" }
  f32: { bits: 32, c_type: "float",   domain: "fp"  }
  f64: { bits: 64, c_type: "double",  domain: "fp"  }

# -- Predicate sets ------------------------------------------------------------
# `icmp`: 10 LLVM predicates Clang emits from C source.
# `fcmp`: 6 preds Clang emits for C float comparisons at -O1
# (PRD §"Floating-point comparison"). C `!=` lowers to `une`
# (unordered-not-equal), not `one`; the remaining five are ordered.
# Other unordered preds are out of scope until fast-math support lands
# (PRD §"Known soft-failure modes").
predicates:
  icmp: [eq, ne, slt, sgt, sle, sge, ult, ugt, ule, uge]
  fcmp: [oeq, une, olt, ogt, ole, oge]

# -- Binary opcodes (18 = 7 int_arith + 6 int_bitwise + 5 fp_arith) -----------
# Int widths: i1, i8, i16, i32, i64.  FP widths: f32, f64.
# Commutative ops carry the qq/hl grid across the fwd, inv, controlled[_inv],
# and (Phase 5) void unc axes. Non-commutative ops additionally carry the lh
# shape (classical-on-left, distinct from classical-on-right `_hl` because
# operand order is observable) on every axis.
# `c_operators` is informational (e2e generators).
binary_opcodes:
  # Integer arithmetic (7)
  - { opcode: add,  family: int_arith,  widths: [i1,i8,i16,i32,i64], llvm_inst: "llvm::Instruction::Add",  c_operators: ["+","+=","++"],                      variants: [fwd_qq, fwd_hl, inv_qq, inv_hl, controlled_qq, controlled_hl, controlled_inv_qq, controlled_inv_hl, unc_qq, unc_hl] }
  - { opcode: sub,  family: int_arith,  widths: [i1,i8,i16,i32,i64], llvm_inst: "llvm::Instruction::Sub",  c_operators: ["-","-=","--","unary -"],            variants: [fwd_qq, fwd_hl, fwd_lh, inv_qq, inv_hl, inv_lh, controlled_qq, controlled_hl, controlled_lh, controlled_inv_qq, controlled_inv_hl, controlled_inv_lh, unc_qq, unc_hl, unc_lh] }
  - { opcode: mul,  family: int_arith,  widths: [i1,i8,i16,i32,i64], llvm_inst: "llvm::Instruction::Mul",  c_operators: ["*","*="],                           variants: [fwd_qq, fwd_hl, inv_qq, inv_hl, controlled_qq, controlled_hl, controlled_inv_qq, controlled_inv_hl, unc_qq, unc_hl] }
  - { opcode: sdiv, family: int_arith,  widths: [i1,i8,i16,i32,i64], llvm_inst: "llvm::Instruction::SDiv", c_operators: ["/","/="], signed_variant: true,     variants: [fwd_qq, fwd_hl, fwd_lh, inv_qq, inv_hl, inv_lh, controlled_qq, controlled_hl, controlled_lh, controlled_inv_qq, controlled_inv_hl, controlled_inv_lh, unc_qq, unc_hl, unc_lh] }
  - { opcode: udiv, family: int_arith,  widths: [i1,i8,i16,i32,i64], llvm_inst: "llvm::Instruction::UDiv", c_operators: ["/","/="], signed_variant: true,     variants: [fwd_qq, fwd_hl, fwd_lh, inv_qq, inv_hl, inv_lh, controlled_qq, controlled_hl, controlled_lh, controlled_inv_qq, controlled_inv_hl, controlled_inv_lh, unc_qq, unc_hl, unc_lh] }
  - { opcode: srem, family: int_arith,  widths: [i1,i8,i16,i32,i64], llvm_inst: "llvm::Instruction::SRem", c_operators: ["%","%="], signed_variant: true,     variants: [fwd_qq, fwd_hl, fwd_lh, inv_qq, inv_hl, inv_lh, controlled_qq, controlled_hl, controlled_lh, controlled_inv_qq, controlled_inv_hl, controlled_inv_lh, unc_qq, unc_hl, unc_lh] }
  - { opcode: urem, family: int_arith,  widths: [i1,i8,i16,i32,i64], llvm_inst: "llvm::Instruction::URem", c_operators: ["%","%="], signed_variant: true,     variants: [fwd_qq, fwd_hl, fwd_lh, inv_qq, inv_hl, inv_lh, controlled_qq, controlled_hl, controlled_lh, controlled_inv_qq, controlled_inv_hl, controlled_inv_lh, unc_qq, unc_hl, unc_lh] }
  # Integer bitwise (6)
  - { opcode: and,  family: int_bitwise, widths: [i1,i8,i16,i32,i64], llvm_inst: "llvm::Instruction::And",  c_operators: ["&","&="],                          variants: [fwd_qq, fwd_hl, inv_qq, inv_hl, controlled_qq, controlled_hl, controlled_inv_qq, controlled_inv_hl, unc_qq, unc_hl] }
  - { opcode: or,   family: int_bitwise, widths: [i1,i8,i16,i32,i64], llvm_inst: "llvm::Instruction::Or",   c_operators: ["|","|="],                          variants: [fwd_qq, fwd_hl, inv_qq, inv_hl, controlled_qq, controlled_hl, controlled_inv_qq, controlled_inv_hl, unc_qq, unc_hl] }
  - { opcode: xor,  family: int_bitwise, widths: [i1,i8,i16,i32,i64], llvm_inst: "llvm::Instruction::Xor",  c_operators: ["^","^=","unary ~"],                variants: [fwd_qq, fwd_hl, inv_qq, inv_hl, controlled_qq, controlled_hl, controlled_inv_qq, controlled_inv_hl, unc_qq, unc_hl] }
  - { opcode: shl,  family: int_bitwise, widths: [i1,i8,i16,i32,i64], llvm_inst: "llvm::Instruction::Shl",  c_operators: ["<<","<<="],                        variants: [fwd_qq, fwd_hl, fwd_lh, inv_qq, inv_hl, inv_lh, controlled_qq, controlled_hl, controlled_lh, controlled_inv_qq, controlled_inv_hl, controlled_inv_lh, unc_qq, unc_hl, unc_lh] }
  - { opcode: lshr, family: int_bitwise, widths: [i1,i8,i16,i32,i64], llvm_inst: "llvm::Instruction::LShr", c_operators: [">>",">>="], signed_variant: true,  variants: [fwd_qq, fwd_hl, fwd_lh, inv_qq, inv_hl, inv_lh, controlled_qq, controlled_hl, controlled_lh, controlled_inv_qq, controlled_inv_hl, controlled_inv_lh, unc_qq, unc_hl, unc_lh] }
  - { opcode: ashr, family: int_bitwise, widths: [i1,i8,i16,i32,i64], llvm_inst: "llvm::Instruction::AShr", c_operators: [">>",">>="], signed_variant: true,  variants: [fwd_qq, fwd_hl, fwd_lh, inv_qq, inv_hl, inv_lh, controlled_qq, controlled_hl, controlled_lh, controlled_inv_qq, controlled_inv_hl, controlled_inv_lh, unc_qq, unc_hl, unc_lh] }
  # Floating-point arithmetic (5; fneg is unary)
  - { opcode: fadd, family: fp_arith,    widths: [f16,f32,f64], llvm_inst: "llvm::Instruction::FAdd", c_operators: ["+","+="], variants: [fwd_qq, fwd_hl, inv_qq, inv_hl, controlled_qq, controlled_hl, controlled_inv_qq, controlled_inv_hl, unc_qq, unc_hl] }
  - { opcode: fsub, family: fp_arith,    widths: [f16,f32,f64], llvm_inst: "llvm::Instruction::FSub", c_operators: ["-","-="], variants: [fwd_qq, fwd_hl, fwd_lh, inv_qq, inv_hl, inv_lh, controlled_qq, controlled_hl, controlled_lh, controlled_inv_qq, controlled_inv_hl, controlled_inv_lh, unc_qq, unc_hl, unc_lh] }
  - { opcode: fmul, family: fp_arith,    widths: [f16,f32,f64], llvm_inst: "llvm::Instruction::FMul", c_operators: ["*","*="], variants: [fwd_qq, fwd_hl, inv_qq, inv_hl, controlled_qq, controlled_hl, controlled_inv_qq, controlled_inv_hl, unc_qq, unc_hl] }
  - { opcode: fdiv, family: fp_arith,    widths: [f16,f32,f64], llvm_inst: "llvm::Instruction::FDiv", c_operators: ["/","/="], variants: [fwd_qq, fwd_hl, fwd_lh, inv_qq, inv_hl, inv_lh, controlled_qq, controlled_hl, controlled_lh, controlled_inv_qq, controlled_inv_hl, controlled_inv_lh, unc_qq, unc_hl, unc_lh] }
  - { opcode: frem, family: fp_arith,    widths: [f16,f32,f64], llvm_inst: "llvm::Instruction::FRem", c_operators: ["%","%="], variants: [fwd_qq, fwd_hl, fwd_lh, inv_qq, inv_hl, inv_lh, controlled_qq, controlled_hl, controlled_lh, controlled_inv_qq, controlled_inv_hl, controlled_inv_lh, unc_qq, unc_hl, unc_lh] }

# -- Unary opcodes (1: fneg) ---------------------------------------------------
# PRD §"Floating-point arithmetic": "the only genuinely new unary opcode".
# Int unary -/~/!/++/-- lower to existing binary opcodes (sub/xor/add).
unary_opcodes:
  - { opcode: fneg, family: fp_arith, widths: [f16,f32,f64], llvm_inst: "llvm::Instruction::FNeg", c_operators: ["unary -"], variants: [fwd, inv, unc] }

# -- Compare opcodes (2 families: icmp, fcmp) ----------------------------------
# Result is a flag handle (i32 ABI, logical-1-bit). PRD §"Comparison contract".
# _hl variants carry handle on LHS, classical scalar on RHS; operand-swap
# canonicalization handles classical-on-lhs at lowering time (so NO _lh form).
# WI-0 (§6.0) adds the void in-place unc_qq/unc_hl axis — the embedded compare
# |a,b,c> -> |a,b, c XOR (a<b)> is a self-inverse permutation, uncomputed by
# recompute-and-XOR from the live sources, exactly like add/mul. No _lh on the
# uncompute axis either (compares never emit _lh), mirroring the commutative
# binary ops.
compare_opcodes:
  - { opcode: icmp, family: int_compare, widths: [i1,i8,i16,i32,i64], llvm_inst: "llvm::Instruction::ICmp", predicate_set: icmp, result_type: flag_handle, variants: [fwd_qq, fwd_hl, inv_qq, inv_hl, unc_qq, unc_hl] }
  - { opcode: fcmp, family: fp_compare,  widths: [f16,f32,f64],       llvm_inst: "llvm::Instruction::FCmp", predicate_set: fcmp, result_type: flag_handle, variants: [fwd_qq, fwd_hl, inv_qq, inv_hl, unc_qq, unc_hl] }

# -- Cast opcodes (9 kinds, 90 cross-pairs) ------------------------------------
# Casts are unary at the IR level — no Q+C variants. PRD §"Integer width
# casts", §"Floating-point width casts", §"Cross-domain casts".
# sitofp/fptosi exclude i1 (signed bool is meaningless; Clang uses
# uitofp/fptoui for _Bool). uitofp/fptoui include i1.
cast_opcodes:
  # Integer width casts (3 kinds x 10 pairs each = 30 pairs)
  - opcode: sext
    kind: int_width
    llvm_inst: "llvm::Instruction::SExt"
    c_operators: ["(signed widen)"]
    variants: [fwd, inv, unc]
    pairs:
      - { from: i1,  to: i8  }
      - { from: i1,  to: i16 }
      - { from: i1,  to: i32 }
      - { from: i1,  to: i64 }
      - { from: i8,  to: i16 }
      - { from: i8,  to: i32 }
      - { from: i8,  to: i64 }
      - { from: i16, to: i32 }
      - { from: i16, to: i64 }
      - { from: i32, to: i64 }
  - opcode: zext
    kind: int_width
    llvm_inst: "llvm::Instruction::ZExt"
    c_operators: ["(unsigned widen)"]
    variants: [fwd, inv, unc]
    pairs:
      - { from: i1,  to: i8  }
      - { from: i1,  to: i16 }
      - { from: i1,  to: i32 }
      - { from: i1,  to: i64 }
      - { from: i8,  to: i16 }
      - { from: i8,  to: i32 }
      - { from: i8,  to: i64 }
      - { from: i16, to: i32 }
      - { from: i16, to: i64 }
      - { from: i32, to: i64 }
  - opcode: trunc
    kind: int_width
    llvm_inst: "llvm::Instruction::Trunc"
    c_operators: ["(narrow)"]
    variants: [fwd, inv, unc]
    pairs:
      - { from: i8,  to: i1  }
      - { from: i16, to: i1  }
      - { from: i16, to: i8  }
      - { from: i32, to: i1  }
      - { from: i32, to: i8  }
      - { from: i32, to: i16 }
      - { from: i64, to: i1  }
      - { from: i64, to: i8  }
      - { from: i64, to: i16 }
      - { from: i64, to: i32 }
  # FP width casts (2 kinds, 3 pairs each: f16<->{f32,f64} + f32<->f64)
  - opcode: fpext
    kind: fp_width
    llvm_inst: "llvm::Instruction::FPExt"
    c_operators: ["(float widen)"]
    variants: [fwd, inv, unc]
    pairs:
      - { from: f16, to: f32 }
      - { from: f16, to: f64 }
      - { from: f32, to: f64 }
  - opcode: fptrunc
    kind: fp_width
    llvm_inst: "llvm::Instruction::FPTrunc"
    c_operators: ["(float narrow)"]
    variants: [fwd, inv, unc]
    pairs:
      - { from: f64, to: f32 }
      - { from: f32, to: f16 }
      - { from: f64, to: f16 }
  # Cross-domain casts (4 kinds, 12+15+12+15 = 54 pairs; +18 touching f16)
  - opcode: sitofp
    kind: int_to_fp
    llvm_inst: "llvm::Instruction::SIToFP"
    c_operators: ["(signed-int -> float)"]
    variants: [fwd, inv, unc]
    pairs:
      - { from: i8,  to: f16 }
      - { from: i8,  to: f32 }
      - { from: i8,  to: f64 }
      - { from: i16, to: f16 }
      - { from: i16, to: f32 }
      - { from: i16, to: f64 }
      - { from: i32, to: f16 }
      - { from: i32, to: f32 }
      - { from: i32, to: f64 }
      - { from: i64, to: f16 }
      - { from: i64, to: f32 }
      - { from: i64, to: f64 }
  - opcode: uitofp
    kind: int_to_fp
    llvm_inst: "llvm::Instruction::UIToFP"
    c_operators: ["(unsigned-int -> float)"]
    variants: [fwd, inv, unc]
    pairs:
      - { from: i1,  to: f16 }
      - { from: i1,  to: f32 }
      - { from: i1,  to: f64 }
      - { from: i8,  to: f16 }
      - { from: i8,  to: f32 }
      - { from: i8,  to: f64 }
      - { from: i16, to: f16 }
      - { from: i16, to: f32 }
      - { from: i16, to: f64 }
      - { from: i32, to: f16 }
      - { from: i32, to: f32 }
      - { from: i32, to: f64 }
      - { from: i64, to: f16 }
      - { from: i64, to: f32 }
      - { from: i64, to: f64 }
  - opcode: fptosi
    kind: fp_to_int
    llvm_inst: "llvm::Instruction::FPToSI"
    c_operators: ["(float -> signed-int)"]
    variants: [fwd, inv, unc]
    pairs:
      - { from: f16, to: i8  }
      - { from: f16, to: i16 }
      - { from: f16, to: i32 }
      - { from: f16, to: i64 }
      - { from: f32, to: i8  }
      - { from: f32, to: i16 }
      - { from: f32, to: i32 }
      - { from: f32, to: i64 }
      - { from: f64, to: i8  }
      - { from: f64, to: i16 }
      - { from: f64, to: i32 }
      - { from: f64, to: i64 }
  - opcode: fptoui
    kind: fp_to_int
    llvm_inst: "llvm::Instruction::FPToUI"
    c_operators: ["(float -> unsigned-int)"]
    variants: [fwd, inv, unc]
    pairs:
      - { from: f16, to: i1  }
      - { from: f16, to: i8  }
      - { from: f16, to: i16 }
      - { from: f16, to: i32 }
      - { from: f16, to: i64 }
      - { from: f32, to: i1  }
      - { from: f32, to: i8  }
      - { from: f32, to: i16 }
      - { from: f32, to: i32 }
      - { from: f32, to: i64 }
      - { from: f64, to: i1  }
      - { from: f64, to: i8  }
      - { from: f64, to: i16 }
      - { from: f64, to: i32 }
      - { from: f64, to: i64 }
# -- End of opcode table -------------------------------------------------------
